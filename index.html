<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartDesk sejal</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script type="module" src="js/app.js"></script>


</head>


<body>


<div class="app">


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside class="sidebar">

        <h1>SmartDesk</h1>


        <nav>


            <!-- DASHBOARD -->

            <button
                class="nav-btn active"
                data-section="dashboard"
            >
                Dashboard
            </button>



            <!-- TASKS -->

            <button
                class="nav-btn"
                data-section="tasksSection"
            >
                Tasks
            </button>



            <!-- EXPENSES -->

            <button
                class="nav-btn"
                data-section="expensesSection"
            >
                Expenses
            </button>



            <!-- NOTES -->

            <button
                class="nav-btn"
                data-section="notesSection"
            >
                Notes
            </button>



            <!-- SHOP -->

            <button
                class="nav-btn"
                data-section="shopSection"
            >
                Shop
            </button>



            <!-- WEATHER -->

            <button
                class="nav-btn"
                data-section="weatherSection"
            >
                Weather
            </button>



            <!-- QUIZ -->

            <button
                class="nav-btn"
                data-section="quizSection"
            >
                Quiz
            </button>


        </nav>



        <!-- =====================================
             THEME BUTTON
        ====================================== -->

        <button
            id="themeBtn"
            type="button"
        >
            🌙 Toggle Theme
        </button>


    </aside>



    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main">



        <!-- =====================================
             DASHBOARD SCREEN
        ====================================== -->

        <section
            id="dashboard"
            class="page-section active"
        >


            <!-- USER INFORMATION -->

            <h2 id="greeting">
                Welcome
            </h2>


            <p id="userMeta"></p>



            <h2>
                Dashboard
            </h2>



            <!-- TASK CARD -->

            <div class="card">

                Tasks:

                <span id="taskCount">
                    0
                </span>

            </div>



            <!-- EXPENSE CARD -->

            <div class="card">

                Expenses: ₹

                <span id="expenseTotal">
                    0
                </span>

            </div>



            <!-- CART CARD -->

            <div class="card">

                Cart items:

                <span id="cardCount">
                    0
                </span>

            </div>


        </section>




        <!-- =====================================
             TASKS SCREEN
        ====================================== -->

        <section
            id="tasksSection"
            class="page-section"
        >

            <h2>
                Tasks
            </h2>



            <!-- ADD TASK -->

            <form id="taskForm">


                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                >



                <select id="taskPriority">

                    <option>
                        Low
                    </option>

                    <option>
                        Medium
                    </option>

                    <option>
                        High
                    </option>

                </select>



                <button type="submit">
                    Add Task
                </button>


            </form>



            <!-- SEARCH TASK -->

            <input
                type="text"
                id="taskSearch"
                placeholder="Search tasks..."
            >



            <!-- TASK LIST -->

            <div id="taskList"></div>


        </section>




        <!-- =====================================
             EXPENSES SCREEN
        ====================================== -->

        <section
            id="expensesSection"
            class="page-section"
        >

            <h2>
                Expenses
            </h2>


            <!--
                Expense form/list can be
                added here later
            -->


        </section>




        <!-- =====================================
             NOTES SCREEN
        ====================================== -->

        <section
            id="notesSection"
            class="page-section"
        >

            <h2>
                Notes
            </h2>



            <!-- ADD NOTE -->

            <form id="noteForm">


                <input
                    type="text"
                    id="noteTitle"
                    placeholder="Enter note title"
                    required
                >



                <textarea
                    id="noteBody"
                    placeholder="Write your note..."
                    required
                ></textarea>



                <button type="submit">
                    Add Note
                </button>


            </form>



            <!-- SEARCH NOTES -->

            <input
                type="text"
                id="noteSearch"
                placeholder="Search notes..."
            >



            <!-- NOTES LIST -->

            <div id="noteList"></div>


        </section>




        <!-- =====================================
             SHOP SCREEN
        ====================================== -->

        <section
            id="shopSection"
            class="page-section"
        >


            <!-- PRODUCTS -->

            <h2>
                Products
            </h2>



            <!-- PRODUCT SEARCH -->

            <input
                type="text"
                id="productSearch"
                placeholder="Search products..."
            >



            <!-- CATEGORY FILTER -->

            <select id="categoryFilter">


                <option value="All">
                    All Categories
                </option>


                <option value="Electronics">
                    Electronics
                </option>


                <option value="Accessories">
                    Accessories
                </option>


            </select>



            <!-- PRICE SORT -->

            <select id="priceSort">


                <option value="default">
                    Sort by Price
                </option>


                <option value="low">
                    Price: Low to High
                </option>


                <option value="high">
                    Price: High to Low
                </option>


            </select>



            <!-- PRODUCT LIST -->

            <div id="productList"></div>



            <!-- =====================================
                 CART
            ====================================== -->

            <h2>
                Cart
            </h2>



            <div id="cartList"></div>



            <p>

                Subtotal: ₹

                <span id="cartSubtotal">
                    0
                </span>

            </p>


        </section>




        <!-- =====================================
             WEATHER SCREEN
        ====================================== -->

        <section
            id="weatherSection"
            class="page-section"
        >

            <h2>
                Weather
            </h2>



            <form id="weatherForm">


                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city"
                >



                <button type="submit">
                    Get Weather
                </button>


            </form>



            <!-- WEATHER STATUS -->

            <div id="weatherStatus"></div>



            <!-- WEATHER RESULT -->

            <div id="weatherResult"></div>


        </section>




        <!-- =====================================
             QUIZ SCREEN
        ====================================== -->

        <section
            id="quizSection"
            class="page-section"
        >


            <div class="quiz-container">


                <!-- QUIZ TITLE -->

                <h2>
                    JavaScript Quiz
                </h2>



                <!-- =====================================
                     QUIZ INFORMATION
                ====================================== -->

                <div class="quiz-info">


                    <!-- SCORE -->

                    <p>

                        Score:

                        <span id="score">
                            0
                        </span>

                    </p>



                    <!-- TIMER -->

                    <p>

                        Time Left:

                        <span id="timer">
                            20
                        </span>

                        seconds

                    </p>


                </div>



                <!-- =====================================
                     QUESTION
                ====================================== -->

                <h3 id="question">

                    Question will appear here

                </h3>



                <!-- =====================================
                     OPTIONS
                ====================================== -->

                <div id="options"></div>



                <!-- =====================================
                     MESSAGE
                ====================================== -->

                <p id="message"></p>



                <!-- =====================================
                     NEXT QUESTION
                ====================================== -->

                <button
                    id="nextBtn"
                    disabled
                >

                    Next Question

                </button>


            </div>


        </section>


    </main>


</div>



<!-- =====================================
     TOAST NOTIFICATION
===================================== -->

<div
    id="toast"
    hidden
>
    Notification
</div>


</body>

</html>
